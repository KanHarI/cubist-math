<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Cubical kernel workbench</title>
    <link rel="stylesheet" href="proof.css" />
    <link rel="stylesheet" href="cubical-workbench.css" />
  </head>
  <body>
    <header><a class="brand" href="index.html">⊢ MathScript <span>Cubical kernel workbench</span></a>
      <nav><a id="source-back" href="proof.html">← Back to MathScript</a><a href="workbench.html">Original Id/J workbench</a></nav>
    </header>
    <main>
      <h1>Checked cubical terms</h1>
      <p id="status" role="status">Loading cubical C/WASM…</p>
      <div class="toolbar">
        <button id="back" disabled>← Back</button>
        <button id="unhighlight">Un-highlight</button>
        <button id="check" disabled>Check edited expression</button>
        <button id="normalize" disabled>Normalize</button>
        <label><input id="fold-names" type="checkbox" checked /> Fold source names</label>
        <label><input id="truncation-sugar" type="checkbox" checked /> Truncation ‖A‖</label>
        <label><input id="identity-sugar" type="checkbox" checked /> Equality as =<sub>T</sub></label>
      </div>
      <div id="diagnostic" role="alert" hidden></div>
      <section class="panel cubical-panel">
        <h2 id="name">Expression</h2>
        <h3>Context</h3><div id="context"></div>
        <h3>Expression</h3><div id="expression" class="kernel-term typeset"></div>
        <h3>Type</h3><div id="type" class="kernel-term typeset"></div>
        <details><summary>Edit native syntax</summary>
          <p>Definitions refer to the checked source registry by name. Editing does not change that registry.</p>
          <textarea id="syntax" spellcheck="false" aria-label="Native cubical expression"></textarea>
        </details>
      </section>
    </main>
    <script type="module" src="cubical-workbench.mjs"></script>
  </body>
</html>
