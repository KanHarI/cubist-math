name: Cubist kernel
# Runs only for pull requests into main, where grouped work lands. Work on
# other branches is checked locally; run this workflow by hand on any branch
# with `gh workflow run ci.yml --ref BRANCH`. A newer push to a pull request
# cancels its older run.
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  workbench:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Migration tests compare against the ledger's historical baseline.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: git clone --depth 1 https://github.com/emscripten-core/emsdk.git .tools/emsdk
      - run: .tools/emsdk/emsdk install 6.0.9 && .tools/emsdk/emsdk activate 6.0.9
      # Dependencies first: npm test runs the browser tests' entry points too.
      - run: npm ci && npx playwright install --with-deps chromium
      - run: make EMCC=.tools/emsdk/upstream/emscripten/emcc wasm-test
      - run: npm run test:browser
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y cppcheck
      - run: make lint
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        compiler: [clang, gcc]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - run: make -j2 CC=${{ matrix.compiler }} CFLAGS='-O3 -std=c11 -Wall -Wextra -Wpedantic -Werror' all test
  sanitizer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: make CC=clang sanitize
