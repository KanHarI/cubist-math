name: C engine
on: [push, pull_request]
permissions:
  contents: read
jobs:
  workbench:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: git clone --depth 1 https://github.com/emscripten-core/emsdk.git .tools/emsdk
      - run: .tools/emsdk/emsdk install 6.0.9 && .tools/emsdk/emsdk activate 6.0.9
      - run: make proof-export && git diff --exit-code -- web/proofs
      - run: make EMCC=.tools/emsdk/upstream/emscripten/emcc wasm-test
      - run: npm ci && npx playwright install --with-deps chromium
      - run: npm run test:browser
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y cppcheck
      - run: make lint
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        compiler: [clang, gcc]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - run: make -j2 CC=${{ matrix.compiler }} CFLAGS='-O3 -std=c11 -Wall -Wextra -Wpedantic -Werror' all test
      - run: build/thth walk 100000 42 2 full 50000
      - run: make CC=${{ matrix.compiler }} collision-test
  sanitizer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: make CC=clang sanitize
  reference:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: make test
      # Private upstream source is intentionally not fetched with extra credentials.
      # A frozen upstream-verified trace is replayed by the C fixture checker.
      - run: python3 tools/check_reference.py
